<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 자동매매 봇</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5B9BD5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="매매봇">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #0F0F1A;
    --surface: #1A1A2E;
    --surface2:#22223A;
    --border:  #2D2D44;
    --green:   #00C896;
    --red:     #FF4757;
    --yellow:  #FFD166;
    --blue:    #4CC9F0;
    --text:    #E8E8F0;
    --muted:   #8888AA;
    --radius:  12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── 헤더 ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,15,26,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .logo em { color: var(--green); font-style: normal; }
  .updated { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  .ws-status { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  .ws-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .ws-dot.ok { background: var(--green); animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  /* ── 뱃지 ── */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
    white-space: nowrap;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .b-live    { background: rgba(255,71,87,0.15);  color: var(--red);    border: 1px solid rgba(255,71,87,0.4); }
  .b-paper   { background: rgba(255,209,102,0.15);color: var(--yellow); border: 1px solid rgba(255,209,102,0.4); }
  .b-demo    { background: rgba(76,201,240,0.15); color: var(--blue);   border: 1px solid rgba(76,201,240,0.4); }
  .b-running { background: rgba(0,200,150,0.15);  color: var(--green);  border: 1px solid rgba(0,200,150,0.4); }
  .b-stopped { background: rgba(136,136,170,0.1); color: var(--muted);  border: 1px solid var(--border); }

  /* ── 버튼 ── */
  .btn {
    border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
    cursor: pointer; padding: 6px 14px; transition: opacity .15s, transform .1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-kill  { background: var(--red);   color: #fff; }
  .btn-start { background: var(--green); color: #000; }
  .btn-add   { background: var(--green); color: #000; }
  .btn-del   { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 2px 4px; }
  .btn-del:hover { color: var(--red); }
  .btn:hover { opacity: 0.85; }

  /* ── 레이아웃 ── */
  .container { max-width: 1440px; margin: 0 auto; padding: 20px 24px; }

  /* ── 포트폴리오 요약 바 ── */
  .pf-bar {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  @media (max-width: 960px) { .pf-bar { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 540px) { .pf-bar { grid-template-columns: repeat(2, 1fr); } }

  .pf-chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 3px;
    position: relative;
  }
  .pf-chip.highlight { border-color: rgba(0,200,150,0.4); }
  .pf-chip.highlight-red { border-color: rgba(255,71,87,0.4); }
  .pf-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .pf-value { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
  .pf-sub   { font-size: 0.65rem; color: var(--muted); margin-top: 1px; }
  .pf-api-err {
    position: absolute; top: 6px; right: 8px;
    font-size: 0.58rem; color: var(--yellow); font-weight: 700;
    background: rgba(255,209,102,0.12); padding: 1px 5px; border-radius: 4px;
  }

  /* ── 시장 바 ── */
  .market-bar {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .mchip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px;
    display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 130px;
  }
  .mchip-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .mchip-value { font-size: 1.05rem; font-weight: 700; }

  /* ── 카드 그리드 ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .cards { grid-template-columns: 1fr 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .card-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .card-value { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; }
  .card-sub   { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .card-sub.pos { color: var(--green); }
  .card-sub.neg { color: var(--red); }

  /* ── 2단 그리드 ── */
  .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 860px) { .grid-main { grid-template-columns: 1fr; } }

  /* ── 패널 ── */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    overflow: hidden;
  }
  .panel + .panel { margin-top: 16px; }
  .panel-title {
    font-size: 0.72rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 14px;
  }
  .panel-title span { color: var(--text); margin-left: 6px; }

  /* ── 차트 ── */
  .chart-wrap { height: 230px; position: relative; }

  /* ── 테이블 ── */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; white-space: nowrap; }
  th {
    text-align: left; padding: 7px 10px;
    color: var(--muted); font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.025); }

  /* ── 결정 뱃지 ── */
  .db {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em;
  }
  .db-buy  { background: rgba(0,200,150,0.18); color: var(--green); }
  .db-sell { background: rgba(255,71,87,0.18);  color: var(--red); }
  .db-hold { background: rgba(136,136,170,0.15); color: var(--muted); }

  /* ── 확신도 바 ── */
  .conf-bar { width: 100%; height: 4px; background: var(--border); border-radius: 99px; margin-top: 4px; }
  .conf-fill { height: 100%; border-radius: 99px; background: var(--green); transition: width .3s; }

  /* ── LLM 패널 아이템 ── */
  .llm-item {
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .llm-item:last-child { border-bottom: none; }
  .llm-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .llm-time { font-size: 0.72rem; color: var(--muted); }
  .llm-ticker { font-weight: 700; font-size: 0.85rem; }
  .llm-reason { font-size: 0.78rem; color: var(--muted); line-height: 1.5; margin-bottom: 4px; }

  /* ── 관심종목 ── */
  .watchlist-add { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .watchlist-add input {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 0.82rem;
    flex: 1; min-width: 90px; outline: none;
  }
  .watchlist-add input:focus { border-color: var(--green); }
  .wl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }
  .wl-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; position: relative;
  }
  .wl-del { position: absolute; top: 8px; right: 8px; }
  .wl-ticker { font-size: 0.85rem; font-weight: 800; margin-bottom: 2px; }
  .wl-name   { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; }
  .wl-price  { font-size: 1rem; font-weight: 700; }
  .wl-dist   { font-size: 0.72rem; margin-top: 3px; }

  /* ── 로그 ── */
  .log-box {
    background: #0A0A14; border: 1px solid var(--border);
    border-radius: 8px; height: 140px; overflow-y: auto;
    padding: 10px 12px; font-size: 0.75rem; font-family: 'Cascadia Code', 'Consolas', monospace;
    color: #66EE88;
  }
  .log-box p { margin-bottom: 2px; opacity: 0.85; }
  .log-box p:last-child { opacity: 1; }
  .log-err { color: var(--red) !important; }
  .log-warn { color: var(--yellow) !important; }

  /* ── 컬러 유틸 ── */
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neutral { color: var(--text); }

  /* ── 빈 상태 ── */
  .empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 0.82rem; }

  /* ── OCO 뱃지 ── */
  .oco { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; background: rgba(76,201,240,0.15); color: var(--blue); }

  /* ── 장 마감 뱃지 ── */
  .market-closed-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 700;
    background: rgba(136,136,170,0.12); color: var(--muted); border: 1px solid var(--border);
  }

  /* ── 모달 ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; max-width: 540px; width: 90%;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; }
  .modal-body { font-size: 0.82rem; color: var(--muted); line-height: 1.7; white-space: pre-wrap; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; line-height: 1; }
  .btn-reason { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 0.72rem; text-decoration: underline; padding: 0; margin-left: 6px; }

  /* ── 관심종목 MA 표시 ── */
  .wl-ma-badge {
    display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 0.65rem; font-weight: 700;
    margin-top: 3px;
  }
  .wl-ma-above { background: rgba(0,200,150,0.15); color: var(--green); }
  .wl-ma-below { background: rgba(255,71,87,0.12); color: var(--red); }

  /* ── 반응형 헤더 ── */
  @media (max-width: 640px) {
    .header { padding: 0 14px; }
    .container { padding: 14px; }
    .logo { font-size: 1rem; }
    .updated, .ws-status { display: none; }
    .card-value { font-size: 1.2rem; }
  }
  @media (max-width: 400px) {
    .mchip-value { font-size: 0.9rem; }
  }

  /* ── 매매 모드 선택기 ── */
  .mode-selector {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center;
  }
  .mode-label { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 4px; }
  .mode-btn {
    border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.8rem; font-weight: 700;
    cursor: pointer; padding: 6px 16px; background: var(--surface2); color: var(--muted);
    transition: all .15s;
  }
  .mode-btn:hover { border-color: var(--blue); color: var(--text); }
  .mode-btn.active { background: var(--blue); border-color: var(--blue); color: #000; }
  .mode-btn.active.m-scalping  { background: var(--red);    border-color: var(--red);    color: #fff; }
  .mode-btn.active.m-day       { background: var(--yellow); border-color: var(--yellow); color: #000; }
  .mode-btn.active.m-swing     { background: var(--green);  border-color: var(--green);  color: #000; }
  .mode-btn.active.m-long      { background: var(--blue);   border-color: var(--blue);   color: #000; }

  /* ── 기술 지표 배지 ── */
  .ind-badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 1px 6px; border-radius: 5px; font-size: 0.62rem; font-weight: 700;
    margin-top: 3px; margin-right: 3px;
  }
  .ind-rsi-ob { background: rgba(255,71,87,0.18); color: var(--red); }
  .ind-rsi-os { background: rgba(0,200,150,0.18); color: var(--green); }
  .ind-rsi-neu{ background: rgba(136,136,170,0.15); color: var(--muted); }
  .ind-macd-up{ background: rgba(0,200,150,0.15); color: var(--green); }
  .ind-macd-dn{ background: rgba(255,71,87,0.12); color: var(--red); }
  .ind-bb-low { background: rgba(76,201,240,0.15); color: var(--blue); }
  .ind-bb-hi  { background: rgba(255,209,102,0.15); color: var(--yellow); }
  .ind-pb     { background: rgba(255,209,102,0.2); color: var(--yellow); }

  /* ── 트레일링 스탑 뱃지 ── */
  .ts-badge {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    font-size: 0.65rem; font-weight: 700;
    background: rgba(76,201,240,0.2); color: var(--blue);
    border: 1px solid rgba(76,201,240,0.4);
  }

  /* ── 백테스트 패널 ── */
  .bt-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-end; }
  .bt-form input, .bt-form select {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 0.82rem; outline: none;
  }
  .bt-form input:focus, .bt-form select:focus { border-color: var(--green); }
  .bt-form select option { background: var(--surface2); }
  .bt-results {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;
    margin-top: 10px;
  }
  .bt-stat {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px;
  }
  .bt-stat-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .bt-stat-value { font-size: 1.05rem; font-weight: 800; }
  .bt-trades { margin-top: 12px; max-height: 200px; overflow-y: auto; }
  .bt-loading { color: var(--muted); font-size: 0.82rem; padding: 12px 0; }
</style>
</head>
<body>

<!-- ══════════════ 헤더 ══════════════ -->
<header class="header">
  <div class="header-left">
    <div class="logo">AI <em>자동매매</em> 봇</div>
    <div class="updated">갱신 <span id="updated-time">-</span></div>
    <div class="ws-status">
      <span class="ws-dot" id="ws-dot"></span>
      <span id="ws-label">연결중</span>
    </div>
  </div>
  <div class="header-right">
    <span id="market-badge"></span>
    <span class="badge" id="mode-badge">-</span>
    <span class="badge" id="run-badge">-</span>
    <button class="btn btn-kill" id="ctrl-btn" onclick="toggleBot()">킬스위치</button>
  </div>
</header>

<!-- LLM 근거 전체 보기 모달 -->
<div class="modal-overlay" id="reason-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="$('reason-modal').classList.remove('show')">✕</button>
    <div class="modal-title">LLM 판단 근거</div>
    <div class="modal-body" id="reason-modal-body"></div>
  </div>
</div>

<!-- ══════════════ 본문 ══════════════ -->
<div class="container">

  <!-- 매매 모드 선택기 -->
  <div class="mode-selector">
    <span class="mode-label">매매 모드</span>
    <button class="mode-btn m-scalping" id="mode-scalping"   onclick="setMode('scalping')">⚡ 스캘핑</button>
    <button class="mode-btn m-day"      id="mode-day_trading" onclick="setMode('day_trading')">📈 단타</button>
    <button class="mode-btn m-swing"    id="mode-swing"      onclick="setMode('swing')">🌊 스윙</button>
    <button class="mode-btn m-long active" id="mode-long_term" onclick="setMode('long_term')">🏔️ 장기(올랜도킴)</button>
    <span id="mode-info" style="font-size:.72rem;color:var(--muted);margin-left:8px"></span>
  </div>

  <!-- 포트폴리오 요약 바 (6칸) -->
  <div class="pf-bar" id="pf-bar">
    <div class="pf-chip highlight">
      <div class="pf-label">총평가액</div>
      <div class="pf-value" id="pf-total">-</div>
      <div class="pf-sub" id="pf-total-sub">-</div>
      <span class="pf-api-err" id="pf-api-err" style="display:none">API오류</span>
    </div>
    <div class="pf-chip">
      <div class="pf-label">원금 (시드)</div>
      <div class="pf-value" id="pf-seed">-</div>
      <div class="pf-sub">투자 원금</div>
    </div>
    <div class="pf-chip">
      <div class="pf-label">현금 (예수금)</div>
      <div class="pf-value" id="pf-cash">-</div>
      <div class="pf-sub" id="pf-cash-pct">-</div>
    </div>
    <div class="pf-chip">
      <div class="pf-label">투자금 (평가)</div>
      <div class="pf-value" id="pf-invested">-</div>
      <div class="pf-sub" id="pf-invested-pct">-</div>
    </div>
    <div class="pf-chip" id="pf-pnl-chip">
      <div class="pf-label">평가 손익</div>
      <div class="pf-value" id="pf-pnl">-</div>
      <div class="pf-sub" id="pf-pnl-pct">-</div>
    </div>
    <div class="pf-chip">
      <div class="pf-label">보유종목 / LLM</div>
      <div class="pf-value" id="pf-slots">0 / 2</div>
      <div class="pf-sub" id="pf-llm-sub">판단 0회</div>
    </div>
  </div>

  <!-- 시장 지수 바 -->
  <div class="market-bar">
    <div class="mchip">
      <div class="mchip-label">KOSPI 등락</div>
      <div class="mchip-value" id="kr-return">-</div>
    </div>
    <div class="mchip">
      <div class="mchip-label">NASDAQ 등락</div>

<script>
/* ════════════════════════════════════════
   종목명 매핑
════════════════════════════════════════ */
const STOCK_NAMES = {
  // KOSPI
  '005930': '삼성전자', '000660': 'SK하이닉스', '035420': 'NAVER',
  '035720': '카카오', '005380': '현대차', '000270': '기아',
  '051910': 'LG화학', '006400': '삼성SDI', '028260': '삼성물산',
  '105560': 'KB금융', '055550': '신한지주', '086790': '하나금융지주',
  '032830': '삼성생명', '003550': 'LG', '034730': 'SK',
  '017670': 'SK텔레콤', '030200': 'KT', '096770': 'SK이노베이션',
  '010130': '고려아연', '003490': '대한항공',
  // NASDAQ / NYSE
  'NVDA': 'NVIDIA', 'AAPL': 'Apple', 'MSFT': 'Microsoft',
  'AMZN': 'Amazon', 'GOOG': 'Alphabet', 'META': 'Meta',
  'TSLA': 'Tesla', 'AMD': 'AMD', 'AVGO': 'Broadcom',
  'MU': 'Micron', 'MRVL': 'Marvell', 'TSM': 'TSMC',
  'DELL': 'Dell', 'VRT': 'Vertiv', 'AMAT': 'Applied Materials',
  'ASML': 'ASML',
};
const stockName = sym => STOCK_NAMES[sym] || sym;

/* ════════════════════════════════════════
   헬퍼
════════════════════════════════════════ */
const $ = id => document.getElementById(id);

function fmt(n) {
  if (n == null) return '-';
  return Number(n).toLocaleString('ko-KR');
}
function fmtPct(n) {
  if (n == null) return '-';
  const v = parseFloat(n);
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}
function pctClass(n) {
  if (n == null) return 'neutral';
  return parseFloat(n) >= 0 ? 'pos' : 'neg';
}
function ts(iso) {
  if (!iso) return '-';
  return iso.slice(11, 16);
}

let _logLines = [];
function addLog(msg, type = '') {
  const d = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  _logLines.push({msg: `[${d}] ${msg}`, type});
  if (_logLines.length > 100) _logLines.shift();
  const box = $('log-box');
  box.innerHTML = _logLines.map(l => `<p class="${l.type ? 'log-' + l.type : ''}">${l.msg}</p>`).join('');
  box.scrollTop = box.scrollHeight;
}

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ════════════════════════════════════════
   상태
════════════════════════════════════════ */
let botRunning = false;

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    botRunning = s.running;

    // 모드 뱃지
    const mb = $('mode-badge');
    if (s.demo_mode) {
      mb.textContent = '🎮 데모';
      mb.className = 'badge b-demo';
    } else if (s.mode === 'live') {
      mb.innerHTML = '<span class="badge-dot"></span> 실전';
      mb.className = 'badge b-live';
    } else {
      mb.innerHTML = '<span class="badge-dot"></span> 모의';
      mb.className = 'badge b-paper';
    }

    // 가동 뱃지
    const rb = $('run-badge');
    rb.innerHTML = s.running
      ? '<span class="badge-dot" style="animation:blink 1.5s infinite"></span> 가동중'
      : '■ 중지';
    rb.className = 'badge ' + (s.running ? 'b-running' : 'b-stopped');

    // 킬스위치/시작 버튼
    const cb = $('ctrl-btn');
    cb.textContent = s.running ? '킬스위치' : '봇 시작';
    cb.className = 'btn ' + (s.running ? 'btn-kill' : 'btn-start');

    if ($('pf-llm-sub')) $('pf-llm-sub').textContent = '판단 ' + (s.llm_call_count || 0) + '회';
    if ($('updated-time')) $('updated-time').textContent = new Date().toLocaleTimeString('ko-KR');
    if ($('last-tick-time') && s.last_tick) {
      $('last-tick-time').textContent = s.last_tick.slice(11, 19);
    }

    // 장 시간 배지
    const mb2 = $('market-badge');
    if (s.market_open) {
      mb2.innerHTML = '';
    } else {
      mb2.innerHTML = '<span class="market-closed-badge">⏸ 장 마감</span>';
    }
  } catch(e) { addLog('status 조회 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   포트폴리오
════════════════════════════════════════ */
async function refreshPortfolio() {
  try {
    const pf = await api('/api/portfolio');
    const seed        = pf.seed || 2000000;
    const totalValue  = pf.total_value || seed;
    const cash        = pf.cash || 0;
    const invested    = pf.invested != null ? pf.invested : Math.max(0, totalValue - cash);
    const pnlAmt      = pf.pnl_amount != null ? pf.pnl_amount : (totalValue - seed);
    const ret         = pf.return_pct ?? 0;
    const retStr      = fmtPct(ret);
    const cls         = pctClass(ret);
    const apiErr      = pf.api_error === true;

    // API 오류 표시
    const errEl = $('pf-api-err');
    if (errEl) errEl.style.display = apiErr ? 'block' : 'none';

    // 총평가액
    $('pf-total').textContent = fmt(totalValue) + '원';
    $('pf-total').className = 'pf-value ' + cls;
    $('pf-total-sub').textContent = retStr + ' (' + (pnlAmt >= 0 ? '+' : '') + fmt(pnlAmt) + '원)';
    $('pf-total-sub').className = 'pf-sub ' + cls;

    // 원금
    $('pf-seed').textContent = fmt(seed) + '원';

    // 현금
    $('pf-cash').textContent = fmt(cash) + '원';
    const cashPct = seed > 0 ? Math.round(cash / seed * 100) : 0;
    $('pf-cash-pct').textContent = '시드 대비 ' + cashPct + '%';

    // 투자금 (주식 평가)
    $('pf-invested').textContent = fmt(invested) + '원';
    const invPct = seed > 0 ? Math.round(invested / seed * 100) : 0;
    $('pf-invested-pct').textContent = '시드 대비 ' + invPct + '%';

    // 평가 손익
    $('pf-pnl').textContent = (pnlAmt >= 0 ? '+' : '') + fmt(pnlAmt) + '원';
    $('pf-pnl').className = 'pf-value ' + cls;
    $('pf-pnl-pct').textContent = retStr;
    $('pf-pnl-pct').className = 'pf-sub ' + cls;
    $('pf-pnl-chip').className = 'pf-chip' + (ret >= 0 ? ' highlight' : ' highlight-red');

    // 갱신 시간
    const now = new Date().toLocaleTimeString('ko-KR');
    if ($('updated-time')) $('updated-time').textContent = now;
    if ($('updated-time2')) $('updated-time2').textContent = now;
  } catch(e) { addLog('포트폴리오 조회 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   차트
════════════════════════════════════════ */
let returnChart;

function initChart() {
  const ctx = $('returnChart').getContext('2d');
  returnChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: '수익률(%)',
        data: [],
        borderColor: '#00C896',
        backgroundColor: 'rgba(0,200,150,0.1)',
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 4,
        fill: true,
        tension: 0.35,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 400 },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ' ' + (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + '%'
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#8888AA', font: { size: 10 }, maxTicksLimit: 8 },
          grid: { color: 'rgba(45,45,68,0.8)' }
        },
        y: {
          ticks: {
            color: '#8888AA', font: { size: 10 },
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%'
          },
          grid: { color: 'rgba(45,45,68,0.8)' }
        }
      }
    }
  });
}

async function refreshChart() {
  try {
    const hist = await api('/api/return-history');
    if (!hist || !hist.length) return;
    returnChart.data.labels = hist.map(h => h.date);
    returnChart.data.datasets[0].data = hist.map(h => h.return_pct);
    returnChart.update('none');
  } catch(e) {/* 조용히 */}
}

/* ════════════════════════════════════════
   포지션
════════════════════════════════════════ */
async function refreshPositions() {
  try {
    const pos = await api('/api/positions');
    if ($('pf-slots')) $('pf-slots').textContent = pos.length + ' / 2';
    $('pos-count').textContent = pos.length ? `(${pos.length}건)` : '';
    const wrap = $('positions-wrap');
    if (!pos.length) {
      wrap.innerHTML = '<div class="empty">보유 포지션 없음</div>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th>종목</th><th>수량</th><th>평단가</th><th>현재가</th>
          <th>수익률</th><th>매입금액</th><th>진입일</th><th>상태</th>
        </tr></thead>
        <tbody>
          ${pos.map(p => {
            const cls = pctClass(p.pnl_pct);
            const tsBadge = p.trailing_stop_active
              ? '<span class="ts-badge">TS 활성</span>'
              : (p.oco_active ? '<span class="oco">OCO</span>' : '-');
            return `<tr>
              <td><b>${p.symbol}</b><br><span style="font-size:.7rem;color:var(--muted)">${p.name || stockName(p.symbol)}</span></td>
              <td>${fmt(p.quantity)}주</td>
              <td>${fmt(p.avg_price)}</td>
              <td>${fmt(p.current_price)}</td>
              <td class="${cls}" style="font-weight:700">${fmtPct(p.pnl_pct)}</td>
              <td>${fmt(Math.round((p.avg_price||0)*(p.quantity||0)))}원</td>
              <td>${p.opened_at ? p.opened_at.slice(0,10) : '-'}</td>
              <td>${tsBadge}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  } catch(e) { addLog('포지션 조회 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   LLM 판단
════════════════════════════════════════ */
async function refreshDecisions() {
  try {
    const decs = await api('/api/decisions');
    const wrap = $('decisions-wrap');
    if (!decs.length) {
      wrap.innerHTML = '<div class="empty">판단 내역 없음</div>';
      return;
    }
    wrap.innerHTML = decs.slice(0, 10).map((d, i) => {
      const dec = (d.decision || 'HOLD').toUpperCase();
      const cls = dec === 'BUY' ? 'db-buy' : dec === 'SELL' ? 'db-sell' : 'db-hold';
      const conf = d.confidence ?? 0;
      const confColor = conf >= 70 ? 'var(--green)' : conf >= 50 ? 'var(--yellow)' : 'var(--muted)';
      const reason = d.reason || '-';
      const shortReason = reason.length > 60 ? reason.slice(0, 60) + '…' : reason;
      return `
        <div class="llm-item">
          <div class="llm-top">
            <span class="llm-time">${ts(d.timestamp)}</span>
            <span class="db ${cls}">${dec}</span>
            ${d.ticker ? `<span class="llm-ticker">${d.ticker}</span><span style="font-size:.72rem;color:var(--muted);margin-left:4px">${stockName(d.ticker)}</span>` : ''}
            <span style="font-size:.72rem;color:var(--muted)">확신도 ${conf}%</span>
            ${reason.length > 60 ? `<button class="btn-reason" onclick="showReason(${i})">전체 보기</button>` : ''}
          </div>
          <div class="conf-bar"><div class="conf-fill" style="width:${conf}%;background:${confColor}"></div></div>
          <div class="llm-reason" style="margin-top:6px">${shortReason}</div>
        </div>`;
    }).join('');
  } catch(e) { addLog('판단 내역 조회 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   관심종목
════════════════════════════════════════ */
async function refreshWatchlist() {
  try {
    const items = await api('/api/watchlist');
    const grid = $('watchlist-grid');
    if (!items.length) {
      grid.innerHTML = '<div class="empty">관심종목 없음</div>';
      return;
    }
    grid.innerHTML = items.map(item => {
      const distText = item.pct_from_high != null
        ? `고점까지 -${item.pct_from_high.toFixed(1)}%`
        : '';
      const distCls = item.pct_from_high != null && item.pct_from_high < 5 ? 'pos' : 'neutral';
      const maBadge = item.above_ma20 != null
        ? `<span class="wl-ma-badge ${item.above_ma20 ? 'wl-ma-above' : 'wl-ma-below'}">${item.above_ma20 ? 'MA20↑' : 'MA20↓'}</span>`
        : '';
      const volText = item.volume_ratio != null
        ? `<div class="wl-dist neutral">거래량 ${item.volume_ratio.toFixed(1)}배</div>`
        : '';

      // 기술 지표 배지
      let indBadges = '';
      if (item.rsi != null) {
        const rsiCls = item.rsi < 35 ? 'ind-rsi-os' : item.rsi > 65 ? 'ind-rsi-ob' : 'ind-rsi-neu';
        indBadges += `<span class="ind-badge ${rsiCls}">RSI ${item.rsi.toFixed(0)}</span>`;
      }
      if (item.macd != null && item.macd_signal != null) {
        const macdUp = item.macd > item.macd_signal;
        indBadges += `<span class="ind-badge ${macdUp ? 'ind-macd-up' : 'ind-macd-dn'}">MACD ${macdUp ? '↑' : '↓'}</span>`;
      }
      if (item.bb_lower != null && item.current_price != null) {
        if (item.current_price <= item.bb_lower * 1.02) {
          indBadges += `<span class="ind-badge ind-bb-low">BB하단</span>`;
        } else if (item.bb_upper != null && item.current_price >= item.bb_upper * 0.98) {
          indBadges += `<span class="ind-badge ind-bb-hi">BB상단</span>`;
        }
      }
      if (item.pullback_detected) {
        indBadges += `<span class="ind-badge ind-pb">눌림목</span>`;
      }

      return `
        <div class="wl-card">
          <button class="btn-del wl-del" onclick="delWatchlist('${item.ticker}')">✕</button>
          <div class="wl-ticker">${item.ticker} ${maBadge}</div>
          <div class="wl-name">${item.name || stockName(item.ticker)}</div>
          <div class="wl-price">${item.current_price != null ? fmt(item.current_price) + '원' : '-'}</div>
          ${distText ? `<div class="wl-dist ${distCls}">${distText}</div>` : ''}
          ${volText}
          ${indBadges ? `<div style="margin-top:5px">${indBadges}</div>` : ''}
        </div>`;
    }).join('');
  } catch(e) { addLog('관심종목 조회 실패: ' + e.message, 'err'); }
}

async function addWatchlist() {
  const ticker = $('wl-ticker').value.trim().toUpperCase();
  const name   = $('wl-name').value.trim();
  if (!ticker) return;
  try {
    await api('/api/watchlist', 'POST', { ticker, name });
    $('wl-ticker').value = '';
    $('wl-name').value   = '';
    addLog(`관심종목 추가: ${ticker}`);
    refreshWatchlist();
  } catch(e) { addLog('추가 실패: ' + e.message, 'err'); }
}

async function delWatchlist(ticker) {
  try {
    await api('/api/watchlist/' + ticker, 'DELETE');
    addLog(`관심종목 삭제: ${ticker}`);
    refreshWatchlist();
  } catch(e) { addLog('삭제 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   봇 제어
════════════════════════════════════════ */
async function toggleBot() {
  try {
    if (botRunning) {
      await api('/api/stop', 'POST');
      addLog('봇 중지 요청', 'warn');
    } else {
      await api('/api/start', 'POST');
      addLog('봇 시작 요청');
    }
    await refreshStatus();
  } catch(e) { addLog('제어 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   WebSocket
════════════════════════════════════════ */
function initWebSocket() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  try {
    ws = new WebSocket(`${proto}://${location.host}/ws/live`);
  } catch(e) {
    $('ws-label').textContent = '폴링';
    return;
  }
  const dot   = $('ws-dot');
  const label = $('ws-label');

  ws.onopen = () => {
    dot.className = 'ws-dot ok';
    label.textContent = '실시간';
    addLog('WebSocket 연결됨');
  };
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'decision') {
        refreshDecisions();
        addLog(`LLM 판단: ${msg.data?.decision} ${msg.data?.ticker || ''}`);
      }
      if (msg.type === 'position') refreshPositions();
      if (msg.type === 'portfolio') refreshPortfolio();
    } catch(_) {}
  };
  ws.onclose = () => {
    dot.className = 'ws-dot';
    label.textContent = '재연결중';
    setTimeout(initWebSocket, 5000);
  };
  ws.onerror = () => ws.close();
}

/* ════════════════════════════════════════
   전체 갱신
════════════════════════════════════════ */
async function refreshAll() {
  await Promise.allSettled([
    refreshStatus(),
    refreshPortfolio(),
    refreshPositions(),
    refreshDecisions(),
    refreshWatchlist(),
    refreshTradingMode(),
  ]);
}

/* ════════════════════════════════════════
   초기화
════════════════════════════════════════ */
initChart();
refreshChart();
initWebSocket();
refreshAll();

// 15초마다 자동 갱신 (포트폴리오/포지션 실시간 반영)
setInterval(refreshAll, 15000);
// 차트는 5분마다
setInterval(refreshChart, 300000);

// 키보드
$('wl-ticker').addEventListener('keydown', e => { if (e.key === 'Enter') addWatchlist(); });
$('wl-name').addEventListener('keydown',   e => { if (e.key === 'Enter') addWatchlist(); });

/* ════════════════════════════════════════
   LLM 근거 모달
════════════════════════════════════════ */
let _lastDecisions = [];

async function showReason(idx) {
  if (!_lastDecisions.length) {
    try { _lastDecisions = await api('/api/decisions'); } catch(_) {}
  }
  const d = _lastDecisions[idx];
  if (!d) return;
  const dec = (d.decision || 'HOLD').toUpperCase();
  $('reason-modal-body').textContent =
    `[${ts(d.timestamp)}] ${dec} ${d.ticker || ''}\n확신도: ${d.confidence ?? 0}%\n\n${d.reason || '-'}`;
  $('reason-modal').classList.add('show');
}

function closeModal(e) {
  if (e.target === $('reason-modal')) $('reason-modal').classList.remove('show');
}

// decisions 갱신 시 캐시 갱신
const _origRefreshDecisions = refreshDecisions;
refreshDecisions = async function() {
  await _origRefreshDecisions();
  try { _lastDecisions = await api('/api/decisions'); } catch(_) {}
};

/* ════════════════════════════════════════
   매매 모드 선택기
════════════════════════════════════════ */
const MODE_LABELS = {
  scalping:    '스캘핑 (손절-1%/익절+1.5%, 10초 틱)',
  day_trading: '단타 (손절-2%/익절+4%, 30초 틱)',
  swing:       '스윙 (손절-3.5%/익절+8%, 5분 틱)',
  long_term:   '장기/올랜도킴 (손절-3.5%/익절+6%, 5분 틱)',
};
const MODE_ID_MAP = {
  scalping: 'mode-scalping',
  day_trading: 'mode-day_trading',
  swing: 'mode-swing',
  long_term: 'mode-long_term',
};
const MODE_CLASS_MAP = {
  scalping: 'm-scalping',
  day_trading: 'm-day',
  swing: 'm-swing',
  long_term: 'm-long',
};

let _currentMode = 'long_term';

async function setMode(mode) {
  try {
    await api('/api/trading-mode', 'POST', { mode });
    _currentMode = mode;
    updateModeUI(mode);
    addLog(`매매 모드 변경: ${MODE_LABELS[mode] || mode}`);
  } catch(e) {
    addLog('모드 변경 실패: ' + e.message, 'err');
  }
}

function updateModeUI(mode) {
  // 모든 버튼 비활성
  Object.keys(MODE_ID_MAP).forEach(m => {
    const btn = $(MODE_ID_MAP[m]);
    if (!btn) return;
    btn.classList.remove('active', 'm-scalping', 'm-day', 'm-swing', 'm-long');
    btn.classList.add(MODE_CLASS_MAP[m]);
  });
  // 활성 버튼
  const activeBtn = $(MODE_ID_MAP[mode]);
  if (activeBtn) activeBtn.classList.add('active');
  // 설명 텍스트
  const info = $('mode-info');
  if (info) info.textContent = MODE_LABELS[mode] || '';
}

async function refreshTradingMode() {
  try {
    const data = await api('/api/trading-mode');
    _currentMode = data.mode || 'long_term';
    updateModeUI(_currentMode);
  } catch(_) {}
}

/* ════════════════════════════════════════
   백테스트
════════════════════════════════════════ */
async function runBacktest() {
  const ticker = $('bt-ticker').value.trim().toUpperCase();
  const strategy = $('bt-strategy').value;
  const period_days = parseInt($('bt-period').value);
  if (!ticker) { addLog('백테스트: 종목코드를 입력하세요', 'warn'); return; }

  const out = $('bt-output');
  out.innerHTML = '<div class="bt-loading">백테스트 실행 중...</div>';

  try {
    const r = await api('/api/backtest', 'POST', { ticker, strategy, period_days });

    if (r.error) {
      out.innerHTML = `<div class="bt-loading" style="color:var(--red)">${r.error}</div>`;
      return;
    }

    const wr = r.win_rate ?? 0;
    const wrCls = wr >= 55 ? 'pos' : wr >= 45 ? 'neutral' : 'neg';
    const ret = r.total_return ?? 0;
    const retCls = ret >= 0 ? 'pos' : 'neg';
    const mdd = r.max_drawdown ?? 0;
    const pf = r.profit_factor ?? 0;
    const pfCls = pf >= 1.5 ? 'pos' : pf >= 1.0 ? 'neutral' : 'neg';
    const sharpe = r.sharpe_ratio ?? 0;

    const trades = r.trades || [];
    const tradeRows = trades.slice(0, 20).map(t => {
      const pc = t.pnl_pct >= 0 ? 'pos' : 'neg';
      return `<tr>
        <td>#${t.entry_idx}</td>
        <td>${t.entry_price?.toFixed(0) ?? '-'}</td>
        <td>${t.exit_price?.toFixed(0) ?? '-'}</td>
        <td class="${pc}">${t.pnl_pct >= 0 ? '+' : ''}${t.pnl_pct?.toFixed(2) ?? '-'}%</td>
        <td>${t.exit_reason || '-'}</td>
      </tr>`;
    }).join('');

    out.innerHTML = `
      <div class="bt-results">
        <div class="bt-stat">
          <div class="bt-stat-label">총 거래</div>
          <div class="bt-stat-value">${r.total_trades}회</div>
        </div>
        <div class="bt-stat">
          <div class="bt-stat-label">승률</div>
          <div class="bt-stat-value ${wrCls}">${wr.toFixed(1)}%</div>
        </div>
        <div class="bt-stat">
          <div class="bt-stat-label">총 수익률</div>
          <div class="bt-stat-value ${retCls}">${ret >= 0 ? '+' : ''}${ret.toFixed(2)}%</div>
        </div>
        <div class="bt-stat">
          <div class="bt-stat-label">최대 낙폭</div>
          <div class="bt-stat-value neg">-${mdd.toFixed(2)}%</div>
        </div>
        <div class="bt-stat">
          <div class="bt-stat-label">손익비(PF)</div>
          <div class="bt-stat-value ${pfCls}">${pf === 9999 ? '∞' : pf.toFixed(2)}</div>
        </div>
        <div class="bt-stat">
          <div class="bt-stat-label">샤프 비율</div>
          <div class="bt-stat-value ${sharpe >= 1 ? 'pos' : 'neutral'}">${sharpe.toFixed(2)}</div>
        </div>
      </div>
      ${trades.length > 0 ? `
      <div class="bt-trades tbl-wrap">
        <table>
          <thead><tr><th>진입봉</th><th>진입가</th><th>청산가</th><th>수익률</th><th>청산사유</th></tr></thead>
          <tbody>${tradeRows}</tbody>
        </table>
      </div>` : ''}`;

    addLog(`백테스트 완료: ${ticker} ${strategy} → 승률 ${wr.toFixed(1)}% 총수익 ${ret >= 0 ? '+' : ''}${ret.toFixed(2)}%`);
  } catch(e) {
    out.innerHTML = `<div class="bt-loading" style="color:var(--red)">오류: ${e.message}</div>`;
    addLog('백테스트 실패: ' + e.message, 'err');
  }
}

/* ════════════════════════════════════════
   초기화 추가
════════════════════════════════════════ */
refreshTradingMode();
$('bt-ticker').addEventListener('keydown', e => { if (e.key === 'Enter') runBacktest(); });
</script>
