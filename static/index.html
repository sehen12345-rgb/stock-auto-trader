<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 자동매매 봇</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #0F0F1A;
    --surface: #1A1A2E;
    --surface2:#22223A;
    --border:  #2D2D44;
    --green:   #00C896;
    --red:     #FF4757;
    --yellow:  #FFD166;
    --blue:    #4CC9F0;
    --text:    #E8E8F0;
    --muted:   #8888AA;
    --radius:  12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── 헤더 ── */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,15,26,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .logo em { color: var(--green); font-style: normal; }
  .updated { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  .ws-status { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  .ws-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .ws-dot.ok { background: var(--green); animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  /* ── 뱃지 ── */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
    white-space: nowrap;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .b-live    { background: rgba(255,71,87,0.15);  color: var(--red);    border: 1px solid rgba(255,71,87,0.4); }
  .b-paper   { background: rgba(255,209,102,0.15);color: var(--yellow); border: 1px solid rgba(255,209,102,0.4); }
  .b-demo    { background: rgba(76,201,240,0.15); color: var(--blue);   border: 1px solid rgba(76,201,240,0.4); }
  .b-running { background: rgba(0,200,150,0.15);  color: var(--green);  border: 1px solid rgba(0,200,150,0.4); }
  .b-stopped { background: rgba(136,136,170,0.1); color: var(--muted);  border: 1px solid var(--border); }

  /* ── 버튼 ── */
  .btn {
    border: none; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
    cursor: pointer; padding: 6px 14px; transition: opacity .15s, transform .1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-kill  { background: var(--red);   color: #fff; }
  .btn-start { background: var(--green); color: #000; }
  .btn-add   { background: var(--green); color: #000; }
  .btn-del   { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 2px 4px; }
  .btn-del:hover { color: var(--red); }
  .btn:hover { opacity: 0.85; }

  /* ── 레이아웃 ── */
  .container { max-width: 1440px; margin: 0 auto; padding: 20px 24px; }

  /* ── 반환율 바 ── */
  .market-bar {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .mchip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px;
    display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 140px;
  }
  .mchip-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .mchip-value { font-size: 1.05rem; font-weight: 700; }

  /* ── 카드 그리드 ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .cards { grid-template-columns: 1fr 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .card-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .card-value { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; }
  .card-sub   { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .card-sub.pos { color: var(--green); }
  .card-sub.neg { color: var(--red); }

  /* ── 2단 그리드 ── */
  .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 860px) { .grid-main { grid-template-columns: 1fr; } }

  /* ── 패널 ── */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    overflow: hidden;
  }
  .panel + .panel { margin-top: 16px; }
  .panel-title {
    font-size: 0.72rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 14px;
  }
  .panel-title span { color: var(--text); margin-left: 6px; }

  /* ── 차트 ── */
  .chart-wrap { height: 230px; position: relative; }

  /* ── 테이블 ── */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; white-space: nowrap; }
  th {
    text-align: left; padding: 7px 10px;
    color: var(--muted); font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.025); }

  /* ── 결정 뱃지 ── */
  .db {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em;
  }
  .db-buy  { background: rgba(0,200,150,0.18); color: var(--green); }
  .db-sell { background: rgba(255,71,87,0.18);  color: var(--red); }
  .db-hold { background: rgba(136,136,170,0.15); color: var(--muted); }

  /* ── 확신도 바 ── */
  .conf-bar { width: 100%; height: 4px; background: var(--border); border-radius: 99px; margin-top: 4px; }
  .conf-fill { height: 100%; border-radius: 99px; background: var(--green); transition: width .3s; }

  /* ── LLM 패널 아이템 ── */
  .llm-item {
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .llm-item:last-child { border-bottom: none; }
  .llm-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .llm-time { font-size: 0.72rem; color: var(--muted); }
  .llm-ticker { font-weight: 700; font-size: 0.85rem; }
  .llm-reason { font-size: 0.78rem; color: var(--muted); line-height: 1.5; margin-bottom: 4px; }

  /* ── 관심종목 ── */
  .watchlist-add { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .watchlist-add input {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 0.82rem;
    flex: 1; min-width: 90px; outline: none;
  }
  .watchlist-add input:focus { border-color: var(--green); }
  .wl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 10px;
  }
  .wl-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; position: relative;
  }
  .wl-del { position: absolute; top: 8px; right: 8px; }
  .wl-ticker { font-size: 0.85rem; font-weight: 800; margin-bottom: 2px; }
  .wl-name   { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; }
  .wl-price  { font-size: 1rem; font-weight: 700; }
  .wl-dist   { font-size: 0.72rem; margin-top: 3px; }

  /* ── 로그 ── */
  .log-box {
    background: #0A0A14; border: 1px solid var(--border);
    border-radius: 8px; height: 140px; overflow-y: auto;
    padding: 10px 12px; font-size: 0.75rem; font-family: 'Cascadia Code', 'Consolas', monospace;
    color: #66EE88;
  }
  .log-box p { margin-bottom: 2px; opacity: 0.85; }
  .log-box p:last-child { opacity: 1; }
  .log-err { color: var(--red) !important; }
  .log-warn { color: var(--yellow) !important; }

  /* ── 컬러 유틸 ── */
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neutral { color: var(--text); }

  /* ── 빈 상태 ── */
  .empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: 0.82rem; }

  /* ── OCO 뱃지 ── */
  .oco { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; background: rgba(76,201,240,0.15); color: var(--blue); }

  /* ── 장 마감 뱃지 ── */
  .market-closed-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 700;
    background: rgba(136,136,170,0.12); color: var(--muted); border: 1px solid var(--border);
  }

  /* ── 모달 ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; max-width: 540px; width: 90%;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; }
  .modal-body { font-size: 0.82rem; color: var(--muted); line-height: 1.7; white-space: pre-wrap; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; line-height: 1; }
  .btn-reason { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 0.72rem; text-decoration: underline; padding: 0; margin-left: 6px; }

  /* ── 관심종목 MA 표시 ── */
  .wl-ma-badge {
    display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 0.65rem; font-weight: 700;
    margin-top: 3px;
  }
  .wl-ma-above { background: rgba(0,200,150,0.15); color: var(--green); }
  .wl-ma-below { background: rgba(255,71,87,0.12); color: var(--red); }

  /* ── 반응형 헤더 ── */
  @media (max-width: 640px) {
    .header { padding: 0 14px; }
    .container { padding: 14px; }
    .logo { font-size: 1rem; }
    .updated, .ws-status { display: none; }
    .card-value { font-size: 1.2rem; }
  }
  @media (max-width: 400px) {
    .mchip-value { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<!-- ══════════════ 헤더 ══════════════ -->
<header class="header">
  <div class="header-left">
    <div class="logo">AI <em>자동매매</em> 봇</div>
    <div class="updated">갱신 <span id="updated-time">-</span></div>
    <div class="ws-status">
      <span class="ws-dot" id="ws-dot"></span>
      <span id="ws-label">연결중</span>
    </div>
  </div>
  <div class="header-right">
    <span id="market-badge"></span>
    <span class="badge" id="mode-badge">-</span>
    <span class="badge" id="run-badge">-</span>
    <button class="btn btn-kill" id="ctrl-btn" onclick="toggleBot()">킬스위치</button>
  </div>
</header>

<!-- LLM 근거 전체 보기 모달 -->
<div class="modal-overlay" id="reason-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="$('reason-modal').classList.remove('show')">✕</button>
    <div class="modal-title">LLM 판단 근거</div>
    <div class="modal-body" id="reason-modal-body"></div>
  </div>
</div>

<!-- ══════════════ 본문 ══════════════ -->
<div class="container">

  <!-- 시장 수익률 바 -->
  <div class="market-bar">
    <div class="mchip">
      <div class="mchip-label">총 수익률</div>
      <div class="mchip-value" id="total-return">-</div>
    </div>
    <div class="mchip">
      <div class="mchip-label">국장 (KOSPI)</div>
      <div class="mchip-value" id="kr-return">-</div>
    </div>
    <div class="mchip">
      <div class="mchip-label">미장 (NASDAQ)</div>
      <div class="mchip-value" id="us-return">+0.00%</div>
    </div>
    <div class="mchip">
      <div class="mchip-label">총평가액</div>
      <div class="mchip-value" id="header-total">-</div>
    </div>
    <div class="mchip">
      <div class="mchip-label">현금</div>
      <div class="mchip-value neutral" id="header-cash">-</div>
    </div>
  </div>

  <!-- 요약 카드 4개 -->
  <div class="cards">
    <div class="card">
      <div class="card-label">총평가액</div>
      <div class="card-value" id="card-total">-</div>
      <div class="card-sub" id="card-pnl">-</div>
    </div>
    <div class="card">
      <div class="card-label">현금 (예수금)</div>
      <div class="card-value" id="card-cash">-</div>
      <div class="card-sub" id="card-cash-pct">-</div>
    </div>
    <div class="card">
      <div class="card-label">보유종목</div>
      <div class="card-value" id="card-positions">0 / 4</div>
      <div class="card-sub">최대 4종목 동시 보유</div>
    </div>
    <div class="card">
      <div class="card-label">LLM 호출 수</div>
      <div class="card-value" id="card-llm">0</div>
      <div class="card-sub">오늘 총 판단 횟수</div>
    </div>
  </div>

  <!-- 차트 + 포지션 -->
  <div class="grid-main">
    <div class="panel">
      <div class="panel-title">수익률 추이 <span id="chart-range">30일 EOD</span></div>
      <div class="chart-wrap">
        <canvas id="returnChart"></canvas>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">현재 포지션 <span id="pos-count"></span></div>
      <div class="tbl-wrap" id="positions-wrap">
        <div class="empty">포지션 없음</div>
      </div>
    </div>
  </div>

  <!-- LLM 판단 패널 -->
  <div class="panel" style="margin-bottom:16px">
    <div class="panel-title">LLM 판단 내역</div>
    <div id="decisions-wrap">
      <div class="empty">판단 내역 없음</div>
    </div>
  </div>

  <!-- 관심종목 -->
  <div class="panel" style="margin-bottom:16px">
    <div class="panel-title">관심종목</div>
    <div class="watchlist-add">
      <input id="wl-ticker" placeholder="종목코드 (예: 005930, AAPL)" maxlength="12">
      <input id="wl-name" placeholder="종목명" maxlength="20">
      <button class="btn btn-add" onclick="addWatchlist()">+ 추가</button>
    </div>
    <div class="wl-grid" id="watchlist-grid">
      <div class="empty">관심종목 없음</div>
    </div>
  </div>

  <!-- 로그 -->
  <div class="panel">
    <div class="panel-title">시스템 로그</div>
    <div class="log-box" id="log-box">
      <p>[시스템] 대시보드 초기화 중...</p>
    </div>
  </div>

</div><!-- /container -->

<script>
/* ════════════════════════════════════════
   헬퍼
════════════════════════════════════════ */
const $ = id => document.getElementById(id);

function fmt(n) {
  if (n == null) return '-';
  return Number(n).toLocaleString('ko-KR');
}
function fmtPct(n) {
  if (n == null) return '-';
  const v = parseFloat(n);
  return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
}
function pctClass(n) {
  if (n == null) return 'neutral';
  return parseFloat(n) >= 0 ? 'pos' : 'neg';
}
function ts(iso) {
  if (!iso) return '-';
  return iso.slice(11, 16);
}

let _logLines = [];
function addLog(msg, type = '') {
  const d = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  _logLines.push({msg: `[${d}] ${msg}`, type});
  if (_logLines.length > 100) _logLines.shift();
  const box = $('log-box');
  box.innerHTML = _logLines.map(l => `<p class="${l.type ? 'log-' + l.type : ''}">${l.msg}</p>`).join('');
  box.scrollTop = box.scrollHeight;
}

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ════════════════════════════════════════
   상태
════════════════════════════════════════ */
let botRunning = false;

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    botRunning = s.running;

    // 모드 뱃지
    const mb = $('mode-badge');
    if (s.demo_mode) {
      mb.textContent = '🎮 데모';
      mb.className = 'badge b-demo';
    } else if (s.mode === 'live') {
      mb.innerHTML = '<span class="badge-dot"></span> 실전';
      mb.className = 'badge b-live';
    } else {
      mb.innerHTML = '<span class="badge-dot"></span> 모의';
      mb.className = 'badge b-paper';
    }

    // 가동 뱃지
    const rb = $('run-badge');
    rb.innerHTML = s.running
      ? '<span class="badge-dot" style="animation:blink 1.5s infinite"></span> 가동중'
      : '■ 중지';
    rb.className = 'badge ' + (s.running ? 'b-running' : 'b-stopped');

    // 킬스위치/시작 버튼
    const cb = $('ctrl-btn');
    cb.textContent = s.running ? '킬스위치' : '봇 시작';
    cb.className = 'btn ' + (s.running ? 'btn-kill' : 'btn-start');

    $('card-llm').textContent = s.llm_call_count;
    $('updated-time').textContent = new Date().toLocaleTimeString('ko-KR');

    // 장 시간 배지
    const mb2 = $('market-badge');
    if (s.market_open) {
      mb2.innerHTML = '';
    } else {
      mb2.innerHTML = '<span class="market-closed-badge">⏸ 장 마감</span>';
    }
  } catch(e) { addLog('status 조회 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   포트폴리오
════════════════════════════════════════ */
async function refreshPortfolio() {
  try {
    const pf = await api('/api/portfolio');
    const ret = pf.return_pct;
    const retStr = fmtPct(ret);
    const cls = pctClass(ret);

    $('total-return').textContent = retStr;
    $('total-return').className = 'mchip-value ' + cls;
    $('kr-return').textContent = retStr;
    $('kr-return').className = 'mchip-value ' + cls;

    $('header-total').textContent = fmt(pf.total_value) + '원';
    $('header-cash').textContent  = fmt(pf.cash) + '원';
    $('card-total').textContent   = fmt(pf.total_value);
    $('card-cash').textContent    = fmt(pf.cash);

    // 수익금 sub
    const seed = pf.seed || 10000000;
    const pnl  = (pf.total_value || seed) - seed;
    const pnlEl = $('card-pnl');
    pnlEl.textContent = (pnl >= 0 ? '+' : '') + fmt(pnl) + '원 (' + retStr + ')';
    pnlEl.className = 'card-sub ' + cls;

    // 현금 비율
    const cashPct = seed > 0 ? Math.round((pf.cash / seed) * 100) : 0;
    $('card-cash-pct').textContent = '시드 대비 ' + cashPct + '%';
  } catch(e) { addLog('포트폴리오 조회 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   차트
════════════════════════════════════════ */
let returnChart;

function initChart() {
  const ctx = $('returnChart').getContext('2d');
  returnChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: '수익률(%)',
        data: [],
        borderColor: '#00C896',
        backgroundColor: 'rgba(0,200,150,0.1)',
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 4,
        fill: true,
        tension: 0.35,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 400 },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ' ' + (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + '%'
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#8888AA', font: { size: 10 }, maxTicksLimit: 8 },
          grid: { color: 'rgba(45,45,68,0.8)' }
        },
        y: {
          ticks: {
            color: '#8888AA', font: { size: 10 },
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%'
          },
          grid: { color: 'rgba(45,45,68,0.8)' }
        }
      }
    }
  });
}

async function refreshChart() {
  try {
    const hist = await api('/api/return-history');
    if (!hist || !hist.length) return;
    returnChart.data.labels = hist.map(h => h.date);
    returnChart.data.datasets[0].data = hist.map(h => h.return_pct);
    returnChart.update('none');
  } catch(e) {/* 조용히 */}
}

/* ════════════════════════════════════════
   포지션
════════════════════════════════════════ */
async function refreshPositions() {
  try {
    const pos = await api('/api/positions');
    $('card-positions').textContent = pos.length + ' / 4';
    $('pos-count').textContent = pos.length ? `(${pos.length}건)` : '';
    const wrap = $('positions-wrap');
    if (!pos.length) {
      wrap.innerHTML = '<div class="empty">보유 포지션 없음</div>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th>종목</th><th>수량</th><th>평단가</th><th>현재가</th>
          <th>수익률</th><th>매입금액</th><th>진입일</th><th>OCO</th>
        </tr></thead>
        <tbody>
          ${pos.map(p => {
            const cls = pctClass(p.pnl_pct);
            return `<tr>
              <td><b>${p.symbol}</b><br><span style="font-size:.7rem;color:var(--muted)">${p.name||''}</span></td>
              <td>${fmt(p.quantity)}주</td>
              <td>${fmt(p.avg_price)}</td>
              <td>${fmt(p.current_price)}</td>
              <td class="${cls}" style="font-weight:700">${fmtPct(p.pnl_pct)}</td>
              <td>${fmt(Math.round((p.avg_price||0)*(p.quantity||0)))}원</td>
              <td>${p.opened_at ? p.opened_at.slice(0,10) : '-'}</td>
              <td>${p.oco_active ? '<span class="oco">활성</span>' : '-'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  } catch(e) { addLog('포지션 조회 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   LLM 판단
════════════════════════════════════════ */
async function refreshDecisions() {
  try {
    const decs = await api('/api/decisions');
    const wrap = $('decisions-wrap');
    if (!decs.length) {
      wrap.innerHTML = '<div class="empty">판단 내역 없음</div>';
      return;
    }
    wrap.innerHTML = decs.slice(0, 10).map((d, i) => {
      const dec = (d.decision || 'HOLD').toUpperCase();
      const cls = dec === 'BUY' ? 'db-buy' : dec === 'SELL' ? 'db-sell' : 'db-hold';
      const conf = d.confidence ?? 0;
      const confColor = conf >= 70 ? 'var(--green)' : conf >= 50 ? 'var(--yellow)' : 'var(--muted)';
      const reason = d.reason || '-';
      const shortReason = reason.length > 60 ? reason.slice(0, 60) + '…' : reason;
      return `
        <div class="llm-item">
          <div class="llm-top">
            <span class="llm-time">${ts(d.timestamp)}</span>
            <span class="db ${cls}">${dec}</span>
            ${d.ticker ? `<span class="llm-ticker">${d.ticker}</span>` : ''}
            <span style="font-size:.72rem;color:var(--muted)">확신도 ${conf}%</span>
            ${reason.length > 60 ? `<button class="btn-reason" onclick="showReason(${i})">전체 보기</button>` : ''}
          </div>
          <div class="conf-bar"><div class="conf-fill" style="width:${conf}%;background:${confColor}"></div></div>
          <div class="llm-reason" style="margin-top:6px">${shortReason}</div>
        </div>`;
    }).join('');
  } catch(e) { addLog('판단 내역 조회 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   관심종목
════════════════════════════════════════ */
async function refreshWatchlist() {
  try {
    const items = await api('/api/watchlist');
    const grid = $('watchlist-grid');
    if (!items.length) {
      grid.innerHTML = '<div class="empty">관심종목 없음</div>';
      return;
    }
    grid.innerHTML = items.map(item => {
      const distText = item.pct_from_high != null
        ? `고점까지 -${item.pct_from_high.toFixed(1)}%`
        : '';
      const distCls = item.pct_from_high != null && item.pct_from_high < 5 ? 'pos' : 'neutral';
      const maBadge = item.above_ma20 != null
        ? `<span class="wl-ma-badge ${item.above_ma20 ? 'wl-ma-above' : 'wl-ma-below'}">${item.above_ma20 ? 'MA20↑' : 'MA20↓'}</span>`
        : '';
      const volText = item.volume_ratio != null
        ? `<div class="wl-dist neutral">거래량 ${item.volume_ratio.toFixed(1)}배</div>`
        : '';
      return `
        <div class="wl-card">
          <button class="btn-del wl-del" onclick="delWatchlist('${item.ticker}')">✕</button>
          <div class="wl-ticker">${item.ticker} ${maBadge}</div>
          <div class="wl-name">${item.name || ''}</div>
          <div class="wl-price">${item.current_price != null ? fmt(item.current_price) + '원' : '-'}</div>
          ${distText ? `<div class="wl-dist ${distCls}">${distText}</div>` : ''}
          ${volText}
        </div>`;
    }).join('');
  } catch(e) { addLog('관심종목 조회 실패: ' + e.message, 'err'); }
}

async function addWatchlist() {
  const ticker = $('wl-ticker').value.trim().toUpperCase();
  const name   = $('wl-name').value.trim();
  if (!ticker) return;
  try {
    await api('/api/watchlist', 'POST', { ticker, name });
    $('wl-ticker').value = '';
    $('wl-name').value   = '';
    addLog(`관심종목 추가: ${ticker}`);
    refreshWatchlist();
  } catch(e) { addLog('추가 실패: ' + e.message, 'err'); }
}

async function delWatchlist(ticker) {
  try {
    await api('/api/watchlist/' + ticker, 'DELETE');
    addLog(`관심종목 삭제: ${ticker}`);
    refreshWatchlist();
  } catch(e) { addLog('삭제 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   봇 제어
════════════════════════════════════════ */
async function toggleBot() {
  try {
    if (botRunning) {
      await api('/api/stop', 'POST');
      addLog('봇 중지 요청', 'warn');
    } else {
      await api('/api/start', 'POST');
      addLog('봇 시작 요청');
    }
    await refreshStatus();
  } catch(e) { addLog('제어 실패: ' + e.message, 'err'); }
}

/* ════════════════════════════════════════
   WebSocket
════════════════════════════════════════ */
function initWebSocket() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  try {
    ws = new WebSocket(`${proto}://${location.host}/ws/live`);
  } catch(e) {
    $('ws-label').textContent = '폴링';
    return;
  }
  const dot   = $('ws-dot');
  const label = $('ws-label');

  ws.onopen = () => {
    dot.className = 'ws-dot ok';
    label.textContent = '실시간';
    addLog('WebSocket 연결됨');
  };
  ws.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'decision') {
        refreshDecisions();
        addLog(`LLM 판단: ${msg.data?.decision} ${msg.data?.ticker || ''}`);
      }
      if (msg.type === 'position') refreshPositions();
      if (msg.type === 'portfolio') refreshPortfolio();
    } catch(_) {}
  };
  ws.onclose = () => {
    dot.className = 'ws-dot';
    label.textContent = '재연결중';
    setTimeout(initWebSocket, 5000);
  };
  ws.onerror = () => ws.close();
}

/* ════════════════════════════════════════
   전체 갱신
════════════════════════════════════════ */
async function refreshAll() {
  await Promise.allSettled([
    refreshStatus(),
    refreshPortfolio(),
    refreshPositions(),
    refreshDecisions(),
    refreshWatchlist(),
  ]);
}

/* ════════════════════════════════════════
   초기화
════════════════════════════════════════ */
initChart();
refreshChart();
initWebSocket();
refreshAll();

// 30초마다 자동 갱신
setInterval(refreshAll, 30000);
// 차트는 5분마다
setInterval(refreshChart, 300000);

// 키보드
$('wl-ticker').addEventListener('keydown', e => { if (e.key === 'Enter') addWatchlist(); });
$('wl-name').addEventListener('keydown',   e => { if (e.key === 'Enter') addWatchlist(); });

/* ════════════════════════════════════════
   LLM 근거 모달
════════════════════════════════════════ */
let _lastDecisions = [];

async function showReason(idx) {
  if (!_lastDecisions.length) {
    try { _lastDecisions = await api('/api/decisions'); } catch(_) {}
  }
  const d = _lastDecisions[idx];
  if (!d) return;
  const dec = (d.decision || 'HOLD').toUpperCase();
  $('reason-modal-body').textContent =
    `[${ts(d.timestamp)}] ${dec} ${d.ticker || ''}\n확신도: ${d.confidence ?? 0}%\n\n${d.reason || '-'}`;
  $('reason-modal').classList.add('show');
}

function closeModal(e) {
  if (e.target === $('reason-modal')) $('reason-modal').classList.remove('show');
}

// decisions 갱신 시 캐시 갱신
const _origRefreshDecisions = refreshDecisions;
refreshDecisions = async function() {
  await _origRefreshDecisions();
  try { _lastDecisions = await api('/api/decisions'); } catch(_) {}
};
</script>
</body>
</html>
